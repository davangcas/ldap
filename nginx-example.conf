# Ejemplo para el nginx del servidor: publica por HTTPS la página de info y LAM,
# que el compose deja en puertos locales. Reemplazar los nombres por LDAP_HOST y
# LAM_HOST del .env. Los certificados HTTPS salen de certbot:
#   sudo certbot --nginx -d ldap-admin.davangcas.site -d lam.davangcas.site

server {
    listen 443 ssl;
    server_name ldap-admin.davangcas.site;

    ssl_certificate /etc/letsencrypt/live/ldap-admin.davangcas.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldap-admin.davangcas.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8041;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name lam.davangcas.site;

    ssl_certificate /etc/letsencrypt/live/ldap-admin.davangcas.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ldap-admin.davangcas.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name ldap-admin.davangcas.site lam.davangcas.site;
    return 301 https://$host$request_uri;
}
