version: "3.8"

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: smartfense-ldap
    environment:
      LDAP_ORGANISATION: "${LDAP_ORGANISATION}"
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"
      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD}"
      LDAP_READONLY_USER: "${LDAP_READONLY_USER}"
      LDAP_READONLY_USER_USERNAME: "${LDAP_READONLY_USER_USERNAME}"
      LDAP_READONLY_USER_PASSWORD: "${LDAP_READONLY_USER_PASSWORD}"
    ports:
      - "127.0.0.1:${LDAP_PORT}:389"
    volumes:
      - ./seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif
    command: --copy-service

  lam:
    image: ghcr.io/ldapaccountmanager/lam:stable
    container_name: smartfense-ldap-admin
    environment:
      LDAP_DOMAIN: "${LDAP_DOMAIN}"
      LDAP_BASE_DN: "${LDAP_BASE_DN}"
      LDAP_SERVER: "ldap://openldap:389"
      LDAP_USER: "cn=admin,${LDAP_BASE_DN}"
      LAM_PASSWORD: "${LAM_PASSWORD}"
      LAM_LANG: "${LAM_LANG}"
    ports:
      - "127.0.0.1:${LAM_PORT:-8040}:80"
    depends_on:
      - openldap
